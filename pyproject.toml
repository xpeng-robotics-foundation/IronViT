[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ironvit"
version = "0.1.0"
description = "IronViT: multi-teacher distilled vision encoders for robotics and VLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.5",
    "transformers>=4.57",
    "pillow>=10.0",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["ironvit*"]
